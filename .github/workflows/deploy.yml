name: Deploy webapp

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              # Full history: the ingest engine runs `git log` to date static
              # sources into the ingest log. A shallow clone has no parent to
              # diff against, so git would misattribute the add to the
              # HEAD/deploy commit instead of the real one.
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Cache sparql-anything jar
              uses: actions/cache@v4
              with:
                  path: tools
                  key: sparql-anything-${{ hashFiles('package.json') }}

            - run: npm install
            - run: npm run pipeline
            - run: npm run webapp:build

            - uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./webapp/dist
                  force_orphan: true

name: Deploy webapp

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Cache sparql-anything jar
              uses: actions/cache@v4
              with:
                  path: tools
                  key: sparql-anything-${{ hashFiles('src/ingest.js') }}

            - run: npm install

            - run: node src/ingest.js
            - run: node src/pipeline.js

            - run: npm install
              working-directory: webapp
            - run: npm run build
              working-directory: webapp

            - name: Stage publish dir
              run: |
                  mkdir -p _site/config _site/data/out
                  cp -r webapp/dist/. _site/
                  cp -r config/. _site/config/
                  cp -r data/out/. _site/data/out/

            - uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./_site
                  force_orphan: true
